# ==============================================================================
# VPS Control Center - Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/vps-control-center.conf
# Symlink: ln -s /etc/nginx/sites-available/vps-control-center.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zone for login requests
limit_req_zone $binary_remote_addr zone=vps_login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name vps.yourdomain.com; # Replace with your server domain or public IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # return 301 https://$host$request_uri;

    client_max_body_size 16M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend Next.js Proxy (Configurable Port, default 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend Agent REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2b. Rate Limiting on Login Endpoint
    location /api/auth/login {
        limit_req zone=vps_login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Real-time WebSocket Proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Optional HTTPS configuration (managed by Certbot):
# Run: sudo certbot --nginx -d vps.yourdomain.com
